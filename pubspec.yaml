name: hindukush
description: "هندوکش غږ — کره خبرونه زمونږ رسالت دی. A Material 3 Expressive RSS reader for Hindukush Ghag (Pashto / Dari / English)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking + feed parsing
  http: ^1.2.0
  xml: ^6.5.0

  # Offline storage (pure-Dart, works on Android / iOS / Windows without
  # any native SQLite toolchain — important for the Windows desktop build).
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0

  # Settings persistence
  shared_preferences: ^2.2.0

  # HTML rendering for WordPress content:encoded
  flutter_widget_from_html_core: ^0.15.2

  # Fully-customisable pull-to-refresh (expressive contained indicator that
  # pushes content down). Pure Dart — works on Android/iOS/Windows.
  custom_refresh_indicator: ^4.0.1

  # Jalali / Hijri-Shamsi calendar for Pashto & Dari dates. Pure Dart.
  shamsi_date: ^1.0.4

  # Inline video playback for self-hosted (mp4) videos on Android/iOS. Desktop
  # has no endorsed implementation, so those fall back to opening externally.
  video_player: ^2.8.0

  # Sharing + opening external links (all support Windows desktop)
  share_plus: ^10.0.0
  url_launcher: ^6.3.0

  # Date formatting / relative times. Left as `any` so it always matches the
  # exact intl version that flutter_localizations pins for the current SDK
  # (avoids a version-solve conflict on CI).
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
