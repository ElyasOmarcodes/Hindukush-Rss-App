name: Build Hindukush

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# One consistent Flutter across every job. Using the latest stable channel
# (rather than a pin) means the Windows runner's Visual Studio is always
# recognised, and every job shares the same, modern Material 3 API surface.
env:
  FLUTTER_CHANNEL: stable
  APP_ORG: com.hindukush
  APP_NAME: hindukush

# Signing material is read from repository Secrets — never committed. Add these
# under: GitHub → Settings → Secrets and variables → Actions.
#   ANDROID_KEYSTORE_BASE64  – base64 of signing/hindukush.p12
#   ANDROID_STORE_PASS       – its store/key password
#   WINDOWS_PFX_BASE64       – base64 of signing/hindukush_windows.pfx
#   WINDOWS_PFX_PASS         – its password
# If a secret is missing, that platform simply builds UNSIGNED (still works).

jobs:
  # ---------------------------------------------------------------------------
  # Analyze + unit tests (fast gate — fails only on real compile errors)
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Scaffold platform folders
        run: flutter create --platforms=android --org $APP_ORG --project-name $APP_NAME .
      - name: Drop the generated widget_test stub (references a non-existent MyApp)
        run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test

  # ---------------------------------------------------------------------------
  # Android — signed, compact arm64 APK
  # ---------------------------------------------------------------------------
  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Scaffold Android project
        run: flutter create --platforms=android --org $APP_ORG --project-name $APP_NAME .
      - name: Patch Android project (INTERNET permission + label)
        run: bash tool/patch_android.sh
      - run: flutter pub get
      # arm64-only release APK (much smaller than a universal APK — drops the
      # armv7/x86_64 native libs; covers essentially all phones from ~2019 on).
      - name: Build compact APK (arm64)
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols
      - name: Sign APK (falls back to the Flutter build if no keystore secret)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASS }}
        run: |
          set -e
          mkdir -p out
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.p12
            SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            BT="$(ls -d "$SDK"/build-tools/*/ | sort -V | tail -1)"
            echo "Signing with release key using build-tools: $BT"
            "${BT}apksigner" sign \
              --ks release.p12 --ks-type PKCS12 \
              --ks-pass "pass:${STORE_PASS}" --key-pass "pass:${STORE_PASS}" \
              --out out/Hindukush.apk "$APK"
            "${BT}apksigner" verify --print-certs out/Hindukush.apk
            rm -f release.p12
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — shipping the default-signed APK."
            cp "$APK" out/Hindukush.apk
          fi
          ls -lh out/Hindukush.apk
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: hindukush-android
          path: out/Hindukush.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # iOS — unsigned .ipa (installable via AltStore / Sideloadly; a paid Apple
  # Developer account is required for a store-signed build, which CI can't do).
  # ---------------------------------------------------------------------------
  ios:
    needs: test
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Scaffold iOS project
        run: flutter create --platforms=ios --org $APP_ORG --project-name $APP_NAME .
      - name: Patch iOS project (display name)
        run: bash tool/patch_ios.sh
      - run: flutter pub get
      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA (single file)
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Hindukush-unsigned.ipa Payload >/dev/null
          ls -lh Hindukush-unsigned.ipa
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: hindukush-ios
          path: build/ios/iphoneos/Hindukush-unsigned.ipa
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows desktop — Authenticode-signed, zipped
  # ---------------------------------------------------------------------------
  windows:
    needs: test
    runs-on: windows-latest
    # Desktop builds depend on the runner's Visual Studio toolchain and must
    # never block the Android/iOS artifacts or the release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Scaffold Windows project
        run: flutter create --platforms=windows --org $env:APP_ORG --project-name $env:APP_NAME .
      - run: flutter pub get
      - name: Diagnose toolchain
        run: flutter doctor -v
      - name: Build Windows (release)
        run: flutter build windows --release
      - name: Sign the executable (self-signed Authenticode, if secret present)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.WINDOWS_PFX_PASS }}
        run: |
          $exe = "build/windows/x64/runner/Release/$env:APP_NAME.exe"
          if (-not (Test-Path $exe)) { throw "Executable not found: $exe" }
          if ([string]::IsNullOrEmpty($env:PFX_B64) -or [string]::IsNullOrEmpty($env:PFX_PASS)) {
            Write-Host "::warning::No WINDOWS_PFX_BASE64 secret — Windows build is unsigned."
          } else {
            [IO.File]::WriteAllBytes("win.pfx", [Convert]::FromBase64String($env:PFX_B64))
            $pw = ConvertTo-SecureString -String $env:PFX_PASS -Force -AsPlainText
            $cert = Get-PfxCertificate -FilePath "win.pfx" -Password $pw
            Set-AuthenticodeSignature -FilePath $exe -Certificate $cert `
              -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com"
            Get-AuthenticodeSignature $exe | Format-List
            Remove-Item "win.pfx" -Force
          }
      - name: Zip Windows build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Hindukush-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: hindukush-windows
          path: Hindukush-Windows.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish a GitHub Release with the installable files on version tags (vX.Y.Z)
  # ---------------------------------------------------------------------------
  release:
    needs: [android, ios, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
